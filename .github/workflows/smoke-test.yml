name: Release smoke test

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/my-upload-key.jks"
          test -s "$GITHUB_WORKSPACE/my-upload-key.jks"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am start -W -n com.aistudio.atmosweather.k7m2px/com.example.MainActivity || true
            sleep 25
            echo "=== PROCESS STATE ==="
            adb shell pidof com.aistudio.atmosweather.k7m2px || echo "PROCESS NOT RUNNING (crashed)"
            adb logcat -d > logcat.txt
            adb logcat -d -b crash > crash.txt || true
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" || true

      - name: Show crash logs
        if: always()
        run: |
          echo "=== CRASH BUFFER ==="
          cat crash.txt 2>/dev/null || echo "(no crash buffer)"
          echo "=== FATAL EXCEPTION ==="
          grep -A 50 -E "FATAL EXCEPTION|AndroidRuntime: " logcat.txt 2>/dev/null | head -120 || echo "(no fatal exception in logcat)"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            logcat.txt
            crash.txt
          if-no-files-found: warn
