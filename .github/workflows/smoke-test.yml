name: Release smoke test

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the published release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apk
          gh release download v1.0 -p "Atmos-1.0.apk" -D apk --clobber
          ls -l apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r apk/Atmos-1.0.apk
            adb logcat -c
            adb shell am start -W -n com.aistudio.atmosweather.k7m2px/com.example.MainActivity || true
            sleep 25
            echo "=== PROCESS STATE ==="
            adb shell pidof com.aistudio.atmosweather.k7m2px && echo "APP PROCESS ALIVE" || echo "PROCESS NOT RUNNING (crashed)"
            adb logcat -d > logcat.txt
            adb logcat -d -b crash > crash.txt || true

      - name: Fail on crash
        run: |
          echo "=== CRASH BUFFER ==="
          cat crash.txt 2>/dev/null || true
          if grep -q "FATAL EXCEPTION" logcat.txt crash.txt 2>/dev/null; then
            echo "::error::App crashed on launch"
            grep -A 40 "FATAL EXCEPTION" logcat.txt crash.txt 2>/dev/null | head -80
            exit 1
          fi
          echo "No fatal exception recorded."

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            logcat.txt
            crash.txt
          if-no-files-found: warn
